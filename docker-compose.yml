# Default: Postgres + Redis only (run API + ingest from ./backend locally).
# Full stack in Docker: docker compose --profile app up -d --build
#
# Chroma / vectors: ingest from the host (`cd backend && python -m app.ingest_cli ...`) with
# CHROMA_PATH=../vector_store. Bind-mount ./vector_store into the backend container with profile `app`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: ragchat
    ports:
      - "5432:5432"
    volumes:
      - rag_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragchat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rag-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - rag_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: rag-backend:latest
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/ragchat
      REDIS_URL: redis://redis:6379/0
      DATA_DIR: /data
      CHROMA_PATH: /app/vector_store
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-gpt-4o-mini}
      OPENAI_PLANT_VISION_MODEL: ${OPENAI_PLANT_VISION_MODEL:-gpt-4o}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      TAVILY_TRUSTED_DOMAINS: ${TAVILY_TRUSTED_DOMAINS:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      INGEST_TOKEN: ${INGEST_TOKEN:-rag-dev-ingest-xk9m2p7q}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
    volumes:
      - ./data:/data:ro
      - ./vector_store:/app/vector_store
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl -sf http://127.0.0.1:8000/health >/dev/null || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

  fronteend-1:
    profiles: ["app"]
    build:
      context: .
      dockerfile: fronteend-1/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
    image: rag-fronteend-1:latest
    container_name: rag-fronteend-1
    ports:
      - "8080:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  rag_pgdata:
  rag_redisdata:
  uploads_data:
